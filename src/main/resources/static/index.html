<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS RouteMaster Dashboard</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --panel: #ffffff;
            --primary: #4f46e5;
            --text: #1f2937;
            --border: #e5e7eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .panel {
            background: var(--panel);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h2 { margin-top: 0; margin-bottom: 20px; font-size: 20px; color: var(--primary); }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea { resize: vertical; height: 80px; }
        .counter { font-size: 12px; color: #6b7280; text-align: right; margin-top: 4px; }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }
        button:hover { opacity: 0.9; }
        .full-width { grid-column: span 2; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: #f9fafb; font-weight: 600; }
        .status-pill {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-scheduled { background: #fef3c7; color: #d97706; }
        .status-sent { background: #d1fae5; color: #059669; }
        .btn-delete { background: #ef4444; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; border: none; width: auto;}
    </style>
</head>
<body>

<div class="container">

    <!-- 1. FORM PANEL: CREATE JOURNEY -->
    <div class="panel">
        <h2>Schedule SMS Journey</h2>
        <form id="journeyForm">
            <div class="form-group">
                <label for="campaignName">Campaign Name</label>
                <input type="text" id="campaignName" placeholder="e.g., Summer Flash Sale" required>
            </div>

            <div class="form-group">
                <label for="smsBody">SMS Message Body</label>
                <textarea id="smsBody" placeholder="Type your text message here... Use emojis to see cost scaling changes!" required></textarea>
                <div class="counter" id="charCounter">Characters: 0</div>
            </div>

            <div class="form-group">
                <label for="primaryRoute">Primary Telecom Route</label>
                <select id="primaryRoute">
                    <option value="Twilio">Twilio ($0.0075 / segment)</option>
                    <option value="Infobip">Infobip ($0.0090 / segment)</option>
                    <option value="Sinch">Sinch ($0.0050 / segment)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fallbackRoute">Fallback Route (On Error Failure)</label>
                <select id="fallbackRoute">
                    <option value="Plivo">Plivo</option>
                    <option value="Sinch">Sinch</option>
                </select>
            </div>

            <div class="form-group">
                <label for="scheduledTime">Execution Time</label>
                <input type="datetime-local" id="scheduledTime" required>
            </div>

            <button type="submit">Deploy Journey Engine</button>
        </form>
    </div>

    <!-- 2. LIVE METRICS & RESPONSE PREVIEW -->
    <div class="panel">
        <h2>API Network Response Log</h2>
        <div style="background: #1e1e2e; color: #a6adc8; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; height: 350px; overflow-y: auto;" id="apiResponse">
            // Awaiting form payload submission...
        </div>
    </div>

    <!-- 3. MONITORING BOARD: READ & DELETE -->
    <div class="panel full-width">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Live Active Journeys Database</h2>
            <button onclick="fetchJourneys()" style="width: auto; padding: 6px 12px; font-size: 13px;">Refresh Table Data</button>
        </div>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Campaign Name</th>
                <th>Routing (P / F)</th>
                <th>Chars / Segments</th>
                <th>Est. Cost</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="journeyTableBody">
            <!-- Data injected dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8080/api/journeys';

    // Set default local datetime value to current moment
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('scheduledTime').value = now.toISOString().slice(0, 16);

    // Dynamic front-end UX character tracker
    document.getElementById('smsBody').addEventListener('input', (e) => {
        document.getElementById('charCounter').innerText = `Characters: ${e.target.value.length}`;
    });

    // CRUD: POST - Submit Journey Object
    document.getElementById('journeyForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
            campaignName: document.getElementById('campaignName').value,
            smsBody: document.getElementById('smsBody').value,
            primaryRoute: document.getElementById('primaryRoute').value,
            fallbackRoute: document.getElementById('fallbackRoute').value,
            scheduledTime: document.getElementById('scheduledTime').value
        };

        try {
            const response = await fetch(API_BASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();

            document.getElementById('apiResponse').innerText = JSON.stringify(data, null, 2);
            document.getElementById('journeyForm').reset();
            fetchJourneys(); // Refresh UI table list views
        } catch (error) {
            document.getElementById('apiResponse').innerText = `Error connecting to API:\n${error.message}\n\nIs your IntelliJ application running on port 8080?`;
        }
    });

    // CRUD: GET - Pull tracking data records
    async function fetchJourneys() {
        try {
            const response = await fetch(API_BASE_URL);
            const data = await response.json();
            const tbody = document.getElementById('journeyTableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const isSent = item.status.toLowerCase().includes('sent');
                const statusClass = isSent ? 'status-sent' : 'status-scheduled';

                tbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td><strong>${item.campaignName}</strong><br><small style="color:#6b7280">${item.smsBody}</small></td>
                        <td>${item.primaryRoute} ➡️ ${item.fallbackRoute}</td>
                        <td>${item.charCount} chars / <strong>${item.segments} seg</strong> ${item.unicode ? '🚀' : '🔤'}</td>
                        <td style="color:#059669; font-weight:600;">$${item.cost.toFixed(4)}</td>
                        <td><span class="status-pill ${statusClass}">${item.status}</span></td>
                        <td><button class="btn-delete" onclick="deleteJourney(${item.id})">Delete</button></td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error("Could not populate tracking board tables:", error);
        }
    }

    // CRUD: DELETE - Clear journey lines item
    async function deleteJourney(id) {
        if(confirm(`Are you sure you want to delete Journey ID ${id}?`)) {
            await fetch(`${API_BASE_URL}/${id}`, { method: 'DELETE' });
            fetchJourneys();
        }
    }

    // Initial table sync on layout boot up
    fetchJourneys();
</script>
</body>
</html>
