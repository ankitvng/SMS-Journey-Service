spring.application.name=sms-journey-service
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/sms_journey
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8080
management.endpoints.web.exposure.include=health,info
#pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
# ─── KAFKA ───────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Consumer
spring.kafka.consumer.group-id=sms-journey-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=\
  com.vonage.smsjourney.application.kafka.SmsRoutingDecisionEvent
# ─── APP SPECIFIC ─────────────────────────────────────────────────────────────
app.kafka.sms-topic=sms-journey-topic
app.kafka.sms-group-id=sms-journey-group
#cache
sms-journey.cache.expire-after-write=10m
#rate limiting
sms.rate-limit.requests-limit=5
sms.rate-limit.window-millis=10000
#Asynchronous processing
async.journey.core-pool-size=5
async.journey.max-pool-size=10
async.journey.queue-capacity=100
